<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ashutosh Prajapati | Interactive Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Ashutosh Prajapati</h1>
    <nav>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </nav>
    <button id="darkModeToggle">🌙 Toggle Mode</button>
</header>

<main>

<section id="about" class="card">
    <img src="i1.jpg"Ashutosh Profile" class="profile-img">
    <div>
        <h2>About Me</h2>
        <p>I am a BCA student passionate about Web Development and AI.</p>
    </div>
</section>

<section id="skills" class="card">
    <h2>Skills</h2>
    <ul class="skill-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Firebase</li>
    </ul>
</section>

<section id="contact" class="card">
    <h2>Contact Me</h2>

    <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <textarea id="message" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
        <p id="formMessage"></p>
    </form>
</section>

<section class="card">
    <h2>My Tasks</h2>
    <input type="text" id="taskInput" placeholder="Enter new task">
    <button id="addTaskBtn">Add Task</button>
    <ul id="taskList"></ul>
</section>

</main>

<footer>
    <p>© 2026 Ashutosh Prajapati</p>
</footer>

<script src="script.js"></script>
</body>
</html>
